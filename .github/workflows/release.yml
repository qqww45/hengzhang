name: Release

# 推送 v* 标签，或在 Actions 页手动运行。
# 标签必须等于 package.json 的版本，例如版本 1.0.0 对应标签 v1.0.0。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            Write-Error "标签 $tag 与 package.json 版本 v$version 不一致。先改版本号、提交，再打同名标签。"
            exit 1
          }

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis --publish always
